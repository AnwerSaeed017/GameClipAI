<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Minimal fontconfig for libass subtitles: only the project's fonts + a persistent cache.
     Without this, libass on Windows rescans every system font for each ffmpeg run (minutes each). -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="relative">../../.cache/fontconfig</cachedir>
</fontconfig>
